<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather Analytics Dashboard</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f6fa;color:#1f2937}.header{background:white;padding:25px;text-align:center;border-bottom:1px solid #e5e7eb}.header h1{margin:0 0 8px}.header p{margin:0;color:#6b7280}.container{max-width:1250px;margin:auto;padding:25px}.search-box{background:white;padding:20px;border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.06);display:flex;gap:10px;justify-content:center;margin-bottom:20px}#city{width:420px;padding:13px 16px;border:1px solid #d1d5db;border-radius:8px;font-size:16px}#searchBtn{padding:13px 22px;border:0;border-radius:8px;background:#2563eb;color:white;font-size:16px;cursor:pointer}#status{text-align:center;margin:12px 0;color:#6b7280;min-height:20px}#location{text-align:center;font-size:23px;font-weight:bold;margin:20px 0}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{background:white;padding:20px;border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.06);text-align:center}.card-title{color:#6b7280;font-size:14px;margin-bottom:10px}.card-value{font-size:24px;font-weight:bold}.chart{background:white;margin-top:20px;padding:10px;border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.06)}.footer{text-align:center;padding:25px;color:#6b7280;font-size:13px}@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.search-box{flex-direction:column}#city{width:100%}.cards{grid-template-columns:1fr}}
</style></head>
<body>
<div class="header"><h1>🌦️ Weather Analytics Dashboard</h1><p>Search any city to view current weather and a 7-day forecast</p></div>
<div class="container">
<div class="search-box"><input id="city" type="text" placeholder="Enter city e.g. Durgapur, Mumbai, London"><button id="searchBtn">🔍 Search</button></div>
<div id="status"></div><div id="location">📍 Enter a city above</div>
<div class="cards">
<div class="card"><div class="card-title">🌡️ Temperature</div><div class="card-value" id="temperature">--</div></div>
<div class="card"><div class="card-title">🌡️ Feels Like</div><div class="card-value" id="feels">--</div></div>
<div class="card"><div class="card-title">💧 Humidity</div><div class="card-value" id="humidity">--</div></div>
<div class="card"><div class="card-title">🌬️ Wind Speed</div><div class="card-value" id="wind">--</div></div>
<div class="card"><div class="card-title">🔵 Pressure</div><div class="card-value" id="pressure">--</div></div>
<div class="card"><div class="card-title">🌧️ Rainfall</div><div class="card-value" id="rain">--</div></div>
<div class="card"><div class="card-title">☁️ Cloud Cover</div><div class="card-value" id="cloud">--</div></div>
<div class="card"><div class="card-title">🌤️ Condition</div><div class="card-value" id="condition">--</div></div>
</div>
<div class="chart"><div id="temperatureChart"></div></div><div class="chart"><div id="rainChart"></div></div><div class="chart"><div id="windChart"></div></div>
</div><div class="footer">Weather data provided by Open-Meteo</div>
<script>
const cityInput=document.getElementById("city"),searchButton=document.getElementById("searchBtn"),statusText=document.getElementById("status");
const weatherCodes={0:"Clear Sky",1:"Mainly Clear",2:"Partly Cloudy",3:"Overcast",45:"Fog",48:"Fog",51:"Light Drizzle",53:"Drizzle",55:"Heavy Drizzle",56:"Freezing Drizzle",57:"Freezing Drizzle",61:"Light Rain",63:"Rain",65:"Heavy Rain",66:"Freezing Rain",67:"Heavy Freezing Rain",71:"Light Snow",73:"Snow",75:"Heavy Snow",77:"Snow Grains",80:"Rain Showers",81:"Rain Showers",82:"Heavy Rain Showers",85:"Snow Showers",86:"Heavy Snow Showers",95:"Thunderstorm",96:"Thunderstorm with Hail",99:"Thunderstorm with Heavy Hail"};
async function getWeather(){const city=cityInput.value.trim();if(!city){statusText.textContent="Please enter a city name.";return}statusText.textContent="Loading weather data...";try{const geoURL="https://geocoding-api.open-meteo.com/v1/search?name="+encodeURIComponent(city)+"&count=1&language=en&format=json";const geoResponse=await fetch(geoURL);if(!geoResponse.ok)throw new Error("Geocoding failed");const geoData=await geoResponse.json();if(!geoData.results||!geoData.results.length){statusText.textContent="❌ City not found. Try another city.";return}const place=geoData.results[0];const params=new URLSearchParams({latitude:place.latitude,longitude:place.longitude,current:"temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,surface_pressure,precipitation,cloud_cover,weather_code",daily:"temperature_2m_max,temperature_2m_min,precipitation_sum,wind_speed_10m_max",forecast_days:"7",timezone:"auto"});const response=await fetch("https://api.open-meteo.com/v1/forecast?"+params);if(!response.ok)throw new Error("Weather request failed");const data=await response.json(),current=data.current,daily=data.daily;document.getElementById("location").textContent="📍 "+place.name+", "+(place.country||"");document.getElementById("temperature").textContent=current.temperature_2m+" °C";document.getElementById("feels").textContent=current.apparent_temperature+" °C";document.getElementById("humidity").textContent=current.relative_humidity_2m+" %";document.getElementById("wind").textContent=current.wind_speed_10m+" km/h";document.getElementById("pressure").textContent=current.surface_pressure+" hPa";document.getElementById("rain").textContent=current.precipitation+" mm";document.getElementById("cloud").textContent=current.cloud_cover+" %";document.getElementById("condition").textContent=weatherCodes[current.weather_code]||"Unknown";statusText.textContent="Last updated: "+current.time;
Plotly.newPlot("temperatureChart",[{x:daily.time,y:daily.temperature_2m_max,mode:"lines+markers",name:"Maximum"},{x:daily.time,y:daily.temperature_2m_min,mode:"lines+markers",name:"Minimum"}],{title:"🌡️ 7-Day Temperature Forecast",xaxis:{title:"Date"},yaxis:{title:"Temperature (°C)"},responsive:true});Plotly.newPlot("rainChart",[{x:daily.time,y:daily.precipitation_sum,type:"bar",name:"Rainfall"}],{title:"🌧️ 7-Day Rainfall Forecast",xaxis:{title:"Date"},yaxis:{title:"Rainfall (mm)"},responsive:true});Plotly.newPlot("windChart",[{x:daily.time,y:daily.wind_speed_10m_max,type:"bar",name:"Wind Speed"}],{title:"🌬️ 7-Day Wind Speed Forecast",xaxis:{title:"Date"},yaxis:{title:"Wind Speed (km/h)"},responsive:true});}catch(error){console.error(error);statusText.textContent="❌ Unable to load weather data. Please try again."}}
searchButton.addEventListener("click",getWeather);cityInput.addEventListener("keydown",e=>{if(e.key==="Enter")getWeather()});
</script></body></html>
